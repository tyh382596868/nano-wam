name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps CI light; requirements.txt sees it as satisfied
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        # `python -m pytest` puts the repo root on sys.path so `import nanowam`
        # and the relative config path in tests resolve.
        run: python -m pytest tests/ -q
