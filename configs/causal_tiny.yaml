# nano-wam — causal config for KV-cache autoregressive long-horizon rollout.
# Block-causal attention requires action_horizon == video_horizon.
# Build/train as usual, then dream:
#   python scripts/prepare_data.py --config configs/causal_tiny.yaml --episodes 200
#   python scripts/train.py        --config configs/causal_tiny.yaml
#   python scripts/sample.py       --config configs/causal_tiny.yaml --dream 8

seed: 1337

data:
  name: reacher
  root: data/reacher_causal
  image_size: 64
  ctx_frames: 2
  video_horizon: 4
  action_horizon: 4      # == video_horizon (causal interleaving)
  action_dim: 2

model:
  dim: 256
  depth: 8
  heads: 8
  latent_channels: 4
  patch_size: 8
  route_attention: false
  causal: true           # block-causal attention + KV-cache rollout
  goal_embed: onehot

flow:
  loss_video_weight: 1.0
  loss_action_weight: 1.0
  per_stream_time: false
  sample_steps: 10

train:
  mode_probs: { joint: 0.6, policy: 0.2, world: 0.1, inverse: 0.1 }
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.01
  max_steps: 20000
  warmup_steps: 500
  grad_clip: 1.0
  amp: true
  log_every: 50
  ckpt_every: 2000
  out_dir: runs/reacher_causal

eval:
  episodes: 20
  imagine: none
  replan_every: 4
